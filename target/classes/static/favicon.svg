<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Gradient matching dividend bars -->
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#a78bfa"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <!-- Glow effect for lightbulb -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background matching app body (slate-950) -->
  <rect width="64" height="64" rx="14" fill="#020617"/>
  
  <!-- Subtle border -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#334155" stroke-width="1" opacity="0.5"/>
  
  <!-- Chart bars (ascending) - using dividend bar gradient -->
  <!-- Bar 1 with $ -->
  <rect x="6" y="44" width="10" height="14" rx="2" fill="url(#barGrad)" opacity="0.7"/>
  <text x="11" y="42" font-family="Arial" font-size="8" fill="#c4b5fd" text-anchor="middle" font-weight="bold">$</text>
  
  <!-- Bar 2 with € -->
  <rect x="19" y="36" width="10" height="22" rx="2" fill="url(#barGrad)" opacity="0.8"/>
  <text x="24" y="34" font-family="Arial" font-size="8" fill="#c4b5fd" text-anchor="middle" font-weight="bold">€</text>
  
  <!-- Bar 3 with plane -->
  <rect x="32" y="28" width="10" height="30" rx="2" fill="url(#barGrad)" opacity="0.9"/>
  <text x="37" y="26" font-family="Arial" font-size="9" fill="#c4b5fd" text-anchor="middle">✈</text>
  
  <!-- Bar 4 with car (smaller) -->
  <rect x="45" y="20" width="10" height="38" rx="2" fill="url(#barGrad)"/>
  <g transform="translate(46.5, 11) scale(0.85)">
    <!-- Car body -->
    <rect x="1" y="4" width="8" height="4" rx="1" fill="#c4b5fd"/>
    <!-- Car roof -->
    <rect x="2.5" y="1" width="5" height="3" rx="1" fill="#c4b5fd"/>
    <!-- Wheels -->
    <circle cx="3" cy="8" r="1.5" fill="#8b5cf6"/>
    <circle cx="7" cy="8" r="1.5" fill="#8b5cf6"/>
    <!-- Windows -->
    <rect x="3" y="1.5" width="1.5" height="2" rx="0.3" fill="#020617" opacity="0.5"/>
    <rect x="5.5" y="1.5" width="1.5" height="2" rx="0.3" fill="#020617" opacity="0.5"/>
  </g>
  
  <!-- Lightbulb (idea) - shifted right -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <!-- Bulb glass -->
    <ellipse cx="6" cy="7" rx="5" ry="6" fill="#c4b5fd" opacity="0.85"/>
    <!-- Inner glow -->
    <ellipse cx="6" cy="6" rx="2.5" ry="3.5" fill="#f5f3ff" opacity="0.5"/>
    <!-- Filament -->
    <path d="M4.5 10 Q6 12.5 7.5 10" stroke="#8b5cf6" stroke-width="1" fill="none"/>
    <!-- Base/socket -->
    <rect x="4" y="12" width="4" height="2.5" rx="0.5" fill="#a78bfa"/>
    <rect x="4.5" y="14.5" width="3" height="1.5" rx="0.3" fill="#8b5cf6"/>
    <!-- Light rays -->
    <line x1="-1" y1="7" x2="-3" y2="7" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <line x1="13" y1="7" x2="15" y2="7" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <line x1="2" y1="2" x2="0" y2="0" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
    <line x1="10" y1="2" x2="12" y2="0" stroke="#c4b5fd" stroke-width="1" stroke-linecap="round" opacity="0.5"/>
  </g>
</svg>
